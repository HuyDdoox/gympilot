<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 220" width="350" height="220">
  <defs>
    <linearGradient id="pilatesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="350" height="220" fill="url(#pilatesBg)"/>
  <!-- Pilates Mat & Reformer Line -->
  <rect x="25" y="170" width="300" height="12" rx="4" fill="#0d9488"/>
  <rect x="40" y="166" width="270" height="4" fill="#14b8a6"/>
  <!-- Woman doing Pilates core exercise on mat -->
  <g transform="translate(70, 70)">
    <!-- Pelvis on ground -->
    <ellipse cx="100" cy="95" rx="14" ry="10" fill="#0f766e"/>
    <!-- Torso arched upward -->
    <path d="M 100 95 Q 60 80 50 45" stroke="#0f766e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Head -->
    <circle cx="45" cy="30" r="14" fill="#115e59"/>
    <!-- Arms stabilizing / reaching -->
    <path d="M 60 60 L 95 65" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <path d="M 55 60 L 25 75" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs extended gracefully in air -->
    <path d="M 105 95 Q 160 70 200 45" stroke="#0f766e" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 105 98 Q 155 85 190 70" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
