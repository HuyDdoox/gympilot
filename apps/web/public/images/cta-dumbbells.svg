<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 150" width="350" height="150">
  <defs>
    <linearGradient id="iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Background gym floor -->
  <rect width="350" height="150" fill="#022c22" opacity="0.3"/>
  <!-- Dumbbell 1 -->
  <g transform="translate(40, 25)">
    <!-- Left Plate -->
    <rect x="10" y="10" width="18" height="80" rx="8" fill="url(#iron)"/>
    <rect x="28" y="20" width="14" height="60" rx="6" fill="#1e293b"/>
    <!-- Handle -->
    <rect x="42" y="44" width="70" height="12" rx="3" fill="#94a3b8"/>
    <!-- Knurling texture on handle -->
    <line x1="55" y1="44" x2="55" y2="56" stroke="#475569" stroke-width="2"/>
    <line x1="65" y1="44" x2="65" y2="56" stroke="#475569" stroke-width="2"/>
    <line x1="75" y1="44" x2="75" y2="56" stroke="#475569" stroke-width="2"/>
    <line x1="85" y1="44" x2="85" y2="56" stroke="#475569" stroke-width="2"/>
    <line x1="95" y1="44" x2="95" y2="56" stroke="#475569" stroke-width="2"/>
    <!-- Right Plate -->
    <rect x="112" y="20" width="14" height="60" rx="6" fill="#1e293b"/>
    <rect x="126" y="10" width="18" height="80" rx="8" fill="url(#iron)"/>
    <!-- 20KG text on plate -->
    <text x="19" y="55" font-size="10" font-weight="bold" fill="#64748b" transform="rotate(-90 19 55)">20KG</text>
  </g>
  <!-- Dumbbell 2 in background -->
  <g transform="translate(180, 45) scale(0.85)">
    <rect x="10" y="10" width="18" height="80" rx="8" fill="url(#iron)"/>
    <rect x="28" y="20" width="14" height="60" rx="6" fill="#1e293b"/>
    <rect x="42" y="44" width="70" height="12" rx="3" fill="#94a3b8"/>
    <rect x="112" y="20" width="14" height="60" rx="6" fill="#1e293b"/>
    <rect x="126" y="10" width="18" height="80" rx="8" fill="url(#iron)"/>
  </g>
</svg>
