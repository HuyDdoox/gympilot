<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#ed8936"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>

  <!-- Background gym atmosphere -->
  <rect width="600" height="450" fill="url(#gymBg)"/>
  <circle cx="450" cy="180" r="220" fill="url(#glow)"/>

  <!-- Gym equipment silhouettes in background -->
  <rect x="520" y="80" width="16" height="300" fill="#1e293b" opacity="0.4" rx="4"/>
  <rect x="500" y="120" width="60" height="12" fill="#334155" opacity="0.4" rx="3"/>
  <line x1="450" y1="200" x2="550" y2="200" stroke="#334155" stroke-width="8" opacity="0.3"/>
  <circle cx="450" cy="200" r="20" fill="#1e293b" opacity="0.3"/>
  <circle cx="550" cy="200" r="20" fill="#1e293b" opacity="0.3"/>

  <!-- Athlete Figure (Athletic Woman Smiling in Fitness Gear) -->
  <g transform="translate(180, 20)">
    <!-- Hair PonyTail -->
    <path d="M 220 110 C 270 90, 290 160, 260 210 C 240 180, 230 140, 220 110 Z" fill="url(#hair)"/>

    <!-- Head & Neck -->
    <path d="M 170 120 C 150 70, 220 50, 230 110 C 235 150, 190 170, 170 120 Z" fill="url(#skin)"/>
    <!-- Headband / Hair top -->
    <path d="M 165 95 C 175 60, 230 65, 230 95 C 220 85, 175 80, 165 95 Z" fill="#22c55e"/>

    <!-- Smiling Face Features -->
    <path d="M 180 125 Q 195 140 210 125" stroke="#742a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Eyes closed smiling -->
    <path d="M 175 105 Q 185 98 192 105" stroke="#2d3748" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 200 105 Q 208 98 215 105" stroke="#2d3748" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Neck & Shoulders -->
    <path d="M 185 155 L 180 190 L 130 220 L 130 400 L 300 400 L 290 220 L 225 190 L 215 155 Z" fill="url(#skin)"/>

    <!-- Gym Tank Top (Black with Emerald Trim) -->
    <path d="M 160 210 L 250 210 L 265 390 L 145 390 Z" fill="#0f172a"/>
    <path d="M 190 210 L 220 210 L 215 390 L 195 390 Z" fill="#22c55e" opacity="0.3"/>
    <!-- Tank straps -->
    <path d="M 160 210 L 175 260 L 190 260 L 180 210 Z" fill="#0f172a"/>
    <path d="M 250 210 L 235 260 L 220 260 L 230 210 Z" fill="#0f172a"/>

    <!-- Towel around neck -->
    <path d="M 145 195 C 130 240, 140 320, 150 350 C 160 320, 160 250, 175 205 Z" fill="#ffffff" opacity="0.95" rx="5"/>
    <path d="M 235 200 C 255 240, 260 310, 255 340 C 245 310, 240 250, 225 205 Z" fill="#ffffff" opacity="0.95" rx="5"/>

    <!-- Water Bottle in Hand -->
    <g transform="translate(80, 260)">
      <rect x="0" y="20" width="35" height="90" rx="8" fill="#38bdf8" opacity="0.85"/>
      <rect x="8" y="5" width="18" height="15" rx="3" fill="#0284c7"/>
      <rect x="5" y="45" width="25" height="40" rx="4" fill="#bae6fd" opacity="0.5"/>
    </g>

    <!-- Arm holding bottle -->
    <path d="M 140 220 C 110 260, 95 300, 105 340 C 120 330, 140 290, 160 250 Z" fill="url(#skin)"/>
  </g>
</svg>
